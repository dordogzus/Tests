[AppearanceFlow]

# false = real-session behavior: only real connected players receive slots and
# each joining player chooses one ruler locally through the game's native UI.
# true = old one-PC selector diagnostic: P1-P8 are chosen sequentially.
OnePcNativeSequence = false

# Keep this false for real players. No artificial host/client pair will run.
SafeLoopbackDiagnostic = false

[Overlay]
# Isolation switches — the ESC crash was narrowed to the per-frame
# scrollbar/font writes added in 0.13.60; those are reverted in code, so
# all features ship enabled again. Only touch these for future debugging.
OverlayDisableAll = false

# Individual switches (used after OverlayDisableAll proved the culprit):
OverlayBadge = true
OverlayScrollbar = true
OverlayFontSwaps = true
OverlayCrossfadeMotion = true

# Badge fine-tuning (no rebuild needed — edit, save, relaunch):
#   BadgeScale       multiplies the badge's point size (1.0 = menu size)
#   BadgeXRatio      banner-relative x placement
#   BadgeYMultiplier banner-relative y placement
#   BadgeLineGapRatio retained for compatibility with 0.14.10 configs
BadgeScale = 1.0
#   BadgeFontSize    absolute badge point size (8 = vanilla caption match;
#                    0 = legacy donor-derived sizing, unstable per menu state)
BadgeFontSize = 8.0
#   CounterForceColor re-asserts the digit color every tick (the day-15 save
#                    presents the game's cursed-mode blue; this pins white)
#   CounterColorR/G/B forced digit color, 0-255
CounterForceColor = true
CounterColorR = 255
CounterColorG = 255
CounterColorB = 255
# 0.14.13: screenshot-measured +11 px correction aligns both K left edges.
BadgeXRatio = 0.7563
BadgeYMultiplier = 2.45
BadgeLineGapRatio = 0.15

# Day-counter digit size: multiplies the menu button point size
# (independent of BadgeScale).
CounterScale = 1.25

# Nickname size: multiplies the menu button point size (1.375 = user ask).
NicknameScale = 1.375

# Scrollbar line colors (0-255): the FILL is the brown core inside a
# dark OUTLINE border (pixel-art depth). The THUMB is a grayish handle.
ScrollbarTrackR = 96
ScrollbarTrackG = 62
ScrollbarTrackB = 38
ScrollbarTrackOutlineR = 45
ScrollbarTrackOutlineG = 40
ScrollbarTrackOutlineB = 36
ScrollbarThumbR = 150
ScrollbarThumbG = 150
ScrollbarThumbB = 158
# Screen pixels per art pixel in the generated scrollbar textures (2 keeps
# the painted outline/bevel/grain chunky at the strip size).
ScrollbarPixelScale = 2
# 0.14.10: screenshot-measured correction. The measured banner-child span
# ends about 10% short of the lower frame. Extend only downward so the already
# exact top stays fixed and the painted bottom cap meets the lower bar bottom.
ScrollbarBottomExtendRatio = 0.10

# Retired in 0.13.82: the TMP clone overlay is superseded by the
# set_font postfix re-assert; the flag is kept only for compatibility.
CounterPixelOverlay = false

[DynamicSession]
# Second bisect tier: silence the per-frame non-overlay hooks.
DynamicSessionDisableOpenFriends = false
DynamicSessionDisablePeerWatchdog = false
