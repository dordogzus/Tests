# DC-Coop settings. Lines starting with # are comments.

# Your name shown to other players (max 23 characters).
name = Prisoner

# auto = join a LAN game if one is found within 1.5s, otherwise host one
# host = always host      join = connect to the address below      off = vanilla
mode = auto
join = 192.168.1.10:47770
port = 47770

# Network sends per second (10-60). 30 is plenty on LAN.
tick_rate = 30

# PvP: players must BOTH opt in (default key F9 = 0x78) before they can hurt
# each other. ffa = everyone vs everyone, teams = odd/even slots, off = never.
pvp = ffa
pvp_damage = 0.35
pvp_key = 120

# Downed state + revive instead of instant death while an ally is alive.
revive = 1
# Cells and gold picked up by anyone are given to everyone.
shared_cells = 1

# ---- balance (see docs/BALANCE.md) ----
density_per_player = 0.20
density_cap = 2.5
pressure_per_player = 0.03
boss_falloff = 0.015
enemy_damage_per_player = 0.05
enemy_damage_cap = 1.5
elite_per_player = 0.04

# ---- game field names (only change if a game update renames them) ----
field_cx = cx
field_cy = cy
field_xr = xr
field_yr = yr
field_dx = dx
field_dy = dy
field_dir = dir
field_life = life
field_maxlife = maxLife
